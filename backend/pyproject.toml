[project]
name = "fitness-coach-backend"
version = "0.2.0"
description = "AI-powered fitness coach backend - Garmin data parser, analytics engine, and API server"
requires-python = ">=3.12"

dependencies = [
    "garminconnect>=0.2.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# Ruff's classic default rules, named explicitly so a ruff upgrade that
# widens the defaults doesn't turn CI red on unchanged code.
select = ["E4", "E7", "E9", "F"]
