name: CI

on:
  pull_request:
  push:
    branches: [main, personal]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/coach_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  store:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/coach_store
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle
